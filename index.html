<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Radar System Dashboard</title>
  <style>
    :root { --primary: #4f46e5; --danger: #ef4444; --success: #10b981; --bg: #f8fafc; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: #1e293b; padding: 20px; display: flex; justify-content: center; }
    .dashboard { width: 100%; max-width: 900px; }
    .header { text-align: center; margin-bottom: 40px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .card { background: white; padding: 24px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
    .value { font-size: 3.5rem; font-weight: 800; color: var(--primary); }
    .status-badge { padding: 10px 20px; border-radius: 12px; font-weight: 700; margin-top: 10px; display: inline-block; }
    .status-safe { background: #dcfce7; color: var(--success); }
    .status-alert { background: #fee2e2; color: var(--danger); animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .history-card { background: white; border-radius: 20px; padding: 25px; margin-top: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th { text-align: left; color: #64748b; font-size: 0.8rem; text-transform: uppercase; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
    td { padding: 15px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.95rem; }
    .movement-text { color: var(--danger); font-weight: bold; }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="header"><h1>Radar System Dashboard</h1></div>
    <div class="grid">
      <div class="card">
        <div style="color: #64748b; font-weight: 600;">LIVE DISTANCE</div>
        <div class="value"><span id="distance">--</span> <span style="font-size: 1.5rem">cm</span></div>
      </div>
      <div class="card">
        <div style="color: #64748b; font-weight: 600;">SYSTEM STATUS</div>
        <div id="move-box" class="status-badge status-safe">Movement: <span id="movement">No</span></div>
        <div style="margin-top:15px; font-size: 0.9rem; color: #94a3b8;">LED: <span id="led">OFF</span> | Buzzer: <span id="buzzer">OFF</span></div>
      </div>
    </div>

    <div class="history-card">
      <h3 style="margin-top: 0;">Live Event History (from Database)</h3>
      <table>
        <thead>
          <tr><th>Time</th><th>Reading</th><th>Status</th></tr>
        </thead>
        <tbody id="history">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function update() {
      try {
        const res = await fetch('http://localhost:5000/sensor-data');
        const data = await res.json();
        
        document.getElementById('distance').innerText = data.distance;
        document.getElementById('movement').innerText = data.movement ? 'YES' : 'No';
        document.getElementById('led').innerText = data.led ? 'ON' : 'OFF';
        document.getElementById('buzzer').innerText = data.buzzer ? 'ON' : 'OFF';
        document.getElementById('move-box').className = data.movement ? "status-badge status-alert" : "status-badge status-safe";

        let html = '';
        if (data.history.length === 0) {
          html = '<tr><td colspan="3" style="text-align:center; color:#94a3b8;">No events recorded yet. Get closer than 15cm!</td></tr>';
        } else {
          data.history.forEach(h => {
            const time = new Date(h.timestamp).toLocaleTimeString();
            html += `<tr>
              <td>${time}</td>
              <td style="font-weight:600">${h.distance} cm</td>
              <td class="movement-text">● MOVEMENT DETECTED</td>
            </tr>`;
          });
        }
        document.getElementById('history').innerHTML = html;
      } catch (e) { console.log("Searching for backend..."); }
    }
    setInterval(update, 1000);
    update();
  </script>
</body>
</html>

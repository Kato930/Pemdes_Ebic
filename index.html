<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultrasonic Radar Dashboard</title>
  <style>
    :root {
      --primary: #4f46e5;
      --danger: #ef4444;
      --success: #10b981;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .dashboard {
      width: 100%;
      max-width: 900px;
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--text);
      margin: 0;
      letter-spacing: -1px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: var(--card);
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .value {
      font-size: 3rem;
      font-weight: 800;
      color: var(--primary);
    }

    .status-badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.25rem;
      margin-top: 10px;
    }

    .status-safe { background: #dcfce7; color: var(--success); }
    .status-alert { background: #fee2e2; color: var(--danger); animation: pulse 1s infinite; }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .indicators {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }

    .indicator {
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      border: 2px solid #e2e8f0;
      transition: all 0.3s;
    }

    .active-led { background: #fee2e2; border-color: var(--danger); color: var(--danger); }
    .active-buzzer { background: #ffedd5; border-color: #f97316; color: #f97316; }

    .history-section {
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin-top: 15px;
    }

    th {
      text-align: left;
      padding: 12px;
      font-size: 0.875rem;
      color: #64748b;
      border-bottom: 2px solid #f1f5f9;
    }

    td {
      padding: 16px 12px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.95rem;
    }

    .detected-text { color: var(--danger); font-weight: 700; }
    .clear-text { color: var(--success); font-weight: 600; }

  </style>
</head>
<body>

  <div class="dashboard">
    <div class="header">
      <h1>Radar System Dashboard</h1>
    </div>

    <div class="grid">
      <!-- Distance Card -->
      <div class="card">
        <div class="label">Current Distance</div>
        <div class="value"><span id="distance">--</span><span style="font-size: 1.5rem; margin-left: 5px;">cm</span></div>
      </div>

      <!-- Movement Card -->
      <div class="card">
        <div class="label">System Status</div>
        <div id="move-container" class="status-badge status-safe">
          Movement: <span id="movement">No</span>
        </div>
        <div class="indicators">
          <div id="led-indicator" class="indicator">LED: <span id="led">OFF</span></div>
          <div id="buz-indicator" class="indicator">Buzzer: <span id="buzzer">OFF</span></div>
        </div>
      </div>
    </div>

    <div class="history-section">
      <div class="label" style="margin-bottom: 20px; font-size: 1.1rem; color: var(--text)">Live Event History</div>
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Reading</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="history">
          <!-- Data populated by JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function updateDashboard() {
      try {
        const response = await fetch('http://localhost:5000/sensor-data');
        const data = await response.json();

        // Update basic values
        document.getElementById('distance').innerText = data.distance;
        document.getElementById('movement').innerText = data.movement ? 'YES' : 'No';
        document.getElementById('led').innerText = data.led ? 'ON' : 'OFF';
        document.getElementById('buzzer').innerText = data.buzzer ? 'ON' : 'OFF';

        // Update styles based on movement
        const moveContainer = document.getElementById('move-container');
        const ledInd = document.getElementById('led-indicator');
        const buzInd = document.getElementById('buz-indicator');

        if (data.movement) {
          moveContainer.className = "status-badge status-alert";
          ledInd.className = "indicator active-led";
          buzInd.className = "indicator active-buzzer";
        } else {
          moveContainer.className = "status-badge status-safe";
          ledInd.className = "indicator";
          buzInd.className = "indicator";
        }

        // Update Table
        const tableBody = document.getElementById('history');
        let tableHTML = '';
        data.history.forEach(row => {
          const time = new Date(row.timestamp).toLocaleTimeString();
          tableHTML += `
            <tr>
              <td>${time}</td>
              <td style="font-family: monospace; font-weight: bold;">${row.distance} cm</td>
              <td class="${row.movement ? 'detected-text' : 'clear-text'}">
                ${row.movement ? '● MOVEMENT' : '○ CLEAR'}
              </td>
            </tr>
          `;
        });
        tableBody.innerHTML = tableHTML;

      } catch (err) {
        console.warn("Retrying connection to backend...");
      }
    }

    // Update every second
    setInterval(updateDashboard, 1000);
    updateDashboard();
  </script>
</body>
</html>
